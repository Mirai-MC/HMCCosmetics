name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew clean shadowJar --no-daemon

      - name: Locate release JAR
        id: artifact
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'HMCCosmeticsRemapped-*.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HMCCosmetics-${{ github.ref_name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}
